name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: JUnit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit tests
        run: ./gradlew test --no-daemon --console=plain

      - name: Summarise test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          total = failures = errors = skipped = 0
          for report in glob.glob("build/test-results/test/*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))

          print(f"Tests: {total}, failures: {failures}, errors: {errors}, skipped: {skipped}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## JUnit results (Java ${{ matrix.java }})\n\n")
                  summary.write("| Tests | Failures | Errors | Skipped |\n")
                  summary.write("| --- | --- | --- | --- |\n")
                  summary.write(f"| {total} | {failures} | {errors} | {skipped} |\n")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-java-${{ matrix.java }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
